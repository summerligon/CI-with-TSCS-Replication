name: Replication CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  replicate:
    name: Run replication analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. Set up R ──────────────────────────────────────────────────────────
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      # ── 3. System libraries needed by R packages ─────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            pandoc

      # ── 4. Cache R packages ───────────────────────────────────────────────────
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('R/00_setup.R') }}
          restore-keys: |
            r-pkgs-${{ runner.os }}-

      # ── 5. Install R packages ─────────────────────────────────────────────────
      - name: Install R packages
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "tidyverse", "plm", "sandwich", "lmtest",
            "broom", "knitr", "kableExtra", "haven",
            "here", "scales", "patchwork", "rmarkdown"
          )
          new <- pkgs[!(pkgs %in% installed.packages()[,"Package"])]
          if (length(new) > 0) {
            install.packages(new, repos = "https://cloud.r-project.org")
          }

      # ── 6. Create output directory ────────────────────────────────────────────
      - name: Create output directory
        run: mkdir -p output

      # ── 7. Run data preparation ───────────────────────────────────────────────
      - name: Prepare data
        shell: Rscript {0}
        run: source(here::here("R", "01_data_prep.R"))

      # ── 8. Run core analysis ──────────────────────────────────────────────────
      - name: Run analysis
        shell: Rscript {0}
        run: source(here::here("R", "02_analysis.R"))

      # ── 9. Produce tables ─────────────────────────────────────────────────────
      - name: Produce tables
        shell: Rscript {0}
        run: source(here::here("R", "03_tables.R"))

      # ── 10. Produce figures ───────────────────────────────────────────────────
      - name: Produce figures
        shell: Rscript {0}
        run: source(here::here("R", "04_figures.R"))

      # ── 11. Render R Markdown report ──────────────────────────────────────────
      - name: Render replication report
        shell: Rscript {0}
        run: rmarkdown::render("replication.Rmd", output_dir = "output")

      # ── 12. Upload all outputs as workflow artifact ───────────────────────────
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: replication-output
          path: output/
          if-no-files-found: warn
